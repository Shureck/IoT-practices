story: Проверим, как вы поняли основы работы с выводами.
goals: []                      # у теста цели не нужны
passScore: 0.7                 # доля верных ответов для зачёта

quiz:
  - id: q1
    text: Какая функция делает вывод выходом?
    options: [digitalRead, pinMode, delay, Serial.begin]
    correct: 1                 # номер верного варианта, считая с 0
    explain: pinMode(pin, OUTPUT) настраивает вывод как выход.
  - id: q2
    text: Какие уровни может подавать цифровой выход? (выберите все верные)
    options: [HIGH, LOW, MEDIUM, "3,3 В при HIGH"]
    correct: [0, 1, 3]         # несколько верных — список номеров
    explain: Цифровой выход бывает только HIGH (3,3 В) или LOW (0 В).
  - id: q3
    text: Что делает delay(1000)?
    code: |                    # необязательный блок кода к вопросу
      digitalWrite(2, HIGH);
      delay(1000);
      digitalWrite(2, LOW);
    options: [Ничего, Ждёт одну секунду, Ждёт тысячу секунд]
    correct: 1
    explain: Время задаётся в миллисекундах, 1000 мс = 1 с.
