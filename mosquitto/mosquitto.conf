# Брокер MQTT для ESP32 Lab.
#  1883 — обычный MQTT для настоящих плат ESP32 (PubSubClient);
#  9001 — MQTT поверх WebSocket, доступен только внутри docker-сети:
#         браузер подключается через прокси сервера приложения (/mqtt).
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# учебный брокер: без авторизации
allow_anonymous true
max_packet_size 262144
max_queued_messages 1000

listener 1883
protocol mqtt

listener 9001
protocol websockets
